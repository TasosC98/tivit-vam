# ---------------------------------------------------------------------------
# INTERPRETATION GUIDE:
#
#   Scenario 1 — Classical F1 > 0.4 on most videos:
#     The data, geometry, and TSV labels are all fine. The trained ViViT
#     model is the bottleneck (marginal collapse). Two options:
#       (a) Use the classical detector directly. F1 is what it is.
#       (b) Train a new model that learns to mimic the classical detector
#           (knowledge distillation). The classical detector provides
#           per-frame supervision the original loss did not.
#
#   Scenario 2 — Classical F1 in 0.15-0.4:
#     The data has SOME usable signal but the classical detector's
#     thresholding misses some events. We can:
#       (a) Tune peak_threshold_factor (lower = more recall)
#       (b) Add temporal context (look ahead/back N frames)
#       (c) Apply optical flow specifically
#
#   Scenario 3 — Classical F1 < 0.15:
#     Either the geometry calibration is wrong on this video, OR the video
#     itself doesn't have detectable key motion (too far/blurry/occluded).
#     Look at motion_heatmap.png — if it's mostly uniform noise, the
#     video is the problem. If there are clear peaks but the matcher
#     misses them, threshold tuning will help.
#
# ---------------------------------------------------------------------------
