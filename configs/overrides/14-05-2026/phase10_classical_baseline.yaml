# Phase 10 — Classical (deterministic) piano transcription baseline.
#
# Phase 9 confirmed total marginal-prediction collapse:
#   most_common_argmax_key_pct = 100.0%
#   n_unique_argmax_keys_over_time = 1
#   collapse_severity = PARTIAL but argmax is constant -> effectively SEVERE
#
# The trained ViViT model has converged to predicting ONE constant pitch
# (key 46) for every frame, regardless of input video. No more config
# changes can fix this — it's an architecture/data scale issue.
#
# Phase 10's hypothesis: a deterministic per-key motion detector that uses
# the calibrated geometry directly will outperform the trained model. If it
# achieves F1 > 0.4, the data + geometry are FINE — the trained model is
# the bottleneck and the right next research direction is replacing
# (or distilling into) the model.
#
# The classical detector:
#   1. Builds a homography from the PianoVAM metadata corners
#      (Point_LT/RT/RB/LB) directly to a canonical (180, 1536) rectangle.
#   2. Warps every video frame.
#   3. For each of 88 canonical key polygons, computes per-key motion
#      energy = mean |frame_t - frame_t-1| inside the BOTTOM HALF of each
#      polygon. (Bottom-half because hands rarely reach there; key tip motion
#      is captured.)
#   4. Smooths the per-key time series.
#   5. Peak-detection per key: peak = local max above mean + k*std.
#   6. Output (time, midi_pitch) events.
#   7. Match against TSV ground truth with onset tolerance ±50 ms.
#
# Why marginal collapse cannot happen here:
#   Each key's prediction is computed INDEPENDENTLY from its own polygon.
#   There is no shared classifier. No optimization. No loss function.
#   No way for the system to "collapse to a constant" because there is
#   no learning happening at all.
#
# Stack on:
#   This config does not need to be merged with the training config stack.
#   The classical detector is a standalone CLI tool. The YAML below just
#   centralizes hyperparameters.

classical_detector:
  # Per-key motion smoothing window (frames). 3-5 frames @ 30fps = 100-150 ms.
  smoothing_window: 3
  # Onset peak threshold = mean + factor * std of per-key motion. Lower =
  # more recall, less precision. Tune per dataset.
  peak_threshold_factor: 3.0
  # Minimum gap between consecutive events at the same pitch. Real piano
  # repetitions are >100 ms apart in normal play.
  min_event_gap_s: 0.10
  # Onset tolerance for F1 matching (same as standard MIR-eval).
  onset_tolerance_ms: 50.0

logging:
  out_dir: /home/achatzigiannis/tivit-logs/classical_baseline_14_05_2026

