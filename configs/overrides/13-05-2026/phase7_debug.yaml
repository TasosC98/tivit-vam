# Files to send back so I can diagnose:
#
# A) From step 1 (per-epoch eval):
#    - per_epoch_eval/per_epoch_f1.csv
#    - per_epoch_eval/per_epoch_summary.txt
#    Tells us: which epoch is the best checkpoint, and whether F1 plateaued
#    early or kept rising.
#
# B) From step 2 (per-video debug), for EACH of the 3 videos:
#    - pitch_debug/<video_id>/clip_info.json    <- has the "diagnosis" field
#    - pitch_debug/<video_id>/pitch_offset_histogram.png  <- KEY DIAGNOSTIC
#    - pitch_debug/<video_id>/logit_heatmap.png           <- visual inspection
#    - pitch_debug/<video_id>/first_10_onsets.txt
#
# The pitch_offset_histogram is the most important file. Three patterns:
#
#   Pattern 1 — Centered at 0, narrow spread:
#       The model IS predicting the correct pitches; decoder thresholds
#       just need tuning. Quick fix.
#
#   Pattern 2 — Centered at k ≠ 0 (consistent shift):
#       CALIBRATION OFFSET BUG. The model is predicting key N when GT is
#       key N+k. Means the dataset's pitch-to-key index is off by k, OR
#       the key polygons cover the wrong canonical keys. We can fix by
#       offsetting in the data loader.
#
#   Pattern 3 — Flat / random:
#       The model never learned pitch discrimination. The polygons either
#       don't contain enough per-key signal (insufficient resolution) OR
#       the loss/optimizer didn't push the head. Next move depends on
#       which.
#
# C) Bonus (if you have time): the TSV file for the same video so I can
#    sanity-check the labels match what's visible.
#    Just send the first 50 lines of:
#      /raid_storage/data_achatzigiannis/PianoVAM_v1.0/TSV/2024-02-15_20-07-54.tsv
#
# ---------------------------------------------------------------------------
