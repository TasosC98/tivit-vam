# Phase 7 — systematic debug of pitch discrimination.
#
# Why we're here:
#   - Path A eval revealed pitch_balanced_accuracy = 0.524 (~chance)
#   - onset_event_f1_anypitch = 0.40 (timing works)
#   - pitch_active_f1        = 0.07 (which-key fails)
#   The model detects ~40% of onsets at correct times but assigns them to
#   wrong pitches. F1 won't move further without finding WHY pitch fails.
#
# What this phase does:
#   1. Per-checkpoint sweep: evaluates every epoch_*.pt to find best epoch.
#      Maybe epoch 100 is much better than 200 (over-fitting?). The CSV
#      will tell us.
#   2. Per-video debug dump: for 3 representative videos, runs the trained
#      model and saves:
#        - pitch_offset_histogram (argmax_pred - true_pitch)
#        - logit_heatmap (88 keys x T frames with GT marked)
#        - per_frame_predictions.csv
#        - first_10_onsets.txt
#      These directly answer "is the model systematically off, random, or
#      learning correctly".
#
# Stack on:
#   configs/default.yaml
#   configs/overrides/manual_training.yaml
#   configs/overrides/manual_training_keyroi_train.yaml
#   configs/overrides/06-05-2026/manual_training_keyroi_video_06_05_2026.yaml
#   configs/overrides/06-05-2026/phase5_fix_pitch_head.yaml
#   configs/overrides/06-05-2026/phase5_eval_only_decoder_fix.yaml
#   configs/overrides/13-05-2026/phase7_debug.yaml      <- THIS FILE
#
# This config does NOT retrain — it only reads the existing checkpoints
# under phase5_pitch_fix_06_05_2026/checkpoints. So all outputs land in a
# fresh debug folder.

logging:
  log_dir: /home/achatzigiannis/tivit-logs/phase7_debug_13_05_2026
  checkpoint_dir: /home/achatzigiannis/tivit-logs/phase5_pitch_fix_06_05_2026/checkpoints
  tensorboard: false

