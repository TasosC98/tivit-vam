#   With focal loss properly applied, the onset prediction COUNT should drop
#   dramatically:
#     onset_pred_events_per_clip   2800 -> < 100 (target: 20-50)
#     onset_event_f1               0.015 -> 0.05-0.15
#     patk_onset_f1                0.10  -> 0.15-0.30
#   Pitch_active_f1 should also improve because the decoder isn't being
#   flooded with garbage onsets anymore:
#     pitch_active_f1              0.08  -> 0.12-0.20
#     patk_note_f1                 0.07  -> 0.12-0.20
#
# If F1 still doesn't move past ~0.10 after focal loss, we've reached the
# ceiling of what THIS architecture can do with THIS data. The next move
